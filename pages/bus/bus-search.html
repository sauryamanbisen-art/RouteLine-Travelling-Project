<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Buses | RouteLine Intercity Travel</title>
  <meta name="description" content="Compare thousands of bus routes and operators. Find the best seats at the lowest prices instantly on RouteLine.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <script src="/vendor/lucide.min.js"></script>
  <link rel="stylesheet" href="../../src/css/home/global/style.css">
  <link rel="stylesheet" href="../../src/css/bus/bus.css">
  <link rel="stylesheet" href="../../src/css/home/global/unified-search-dock.css">
  <style>
    .hero-bus {
      background-image: url('../../src/assets/bus_background_img.png');
      background-size: cover;
      background-position: center 38%;
      background-repeat: no-repeat;
    }
  </style>
</head>
<body class="bg-[#f8f9ff]">
  <header class="header">
    <div class="header-container">
      <a href="../../index.html" class="logo" aria-label="RouteLine Home">
        <img src="../../public/Golden RouteLine Diamond Logo.png" alt="RouteLine" class="header-logo" decoding="async">
      </a>
      <nav class="nav-links">
        <a href="../../index.html">Trains</a>
        <a href="../flight/flight-search.html">Flights</a>
        <a href="bus-search.html" class="active">Buses</a>
        <a href="../hotel/hotel-results.html">Hotels</a>
        <a href="#">Offers</a>
      </nav>
      <div class="header-actions">
        <a href="#" class="help-link"><i data-lucide="help-circle" class="icon-small"></i> Help</a>
        <div class="divider"></div>
        <a href="#" class="login-link"><i data-lucide="user" class="icon-small"></i> Login / Sign up</a>
      </div>
    </div>
  </header>
  <main class="w-full">
    <section class="hero-unified hero-bus">
      <div class="hero-unified-overlay"></div>
      <div class="hero-unified-header">
        <h1 class="hero-unified-title" style="color: #ea9b62;">Hit the road,<br>Discover new places.</h1>
        <p class="hero-unified-subtitle">Compare thousands of bus routes and operators. Find the best seats at the lowest prices instantly.</p>
      </div>
      <div class="search-dock-wrapper">
        <div class="dock-mode-row">
          <div class="dock-mode-capsule">
            <a href="../../index.html" class="dock-mode-btn">
              <span class="material-symbols-outlined dock-icon">train</span> Trains
            </a>
            <a href="../flight/flight-search.html" class="dock-mode-btn">
              <span class="material-symbols-outlined dock-icon">flight</span> Flights
            </a>
            <a href="bus-search.html" class="dock-mode-btn active">
              <span class="material-symbols-outlined dock-icon">directions_bus</span> Buses
            </a>
            <a href="../hotel/hotel-results.html" class="dock-mode-btn">
              <span class="material-symbols-outlined dock-icon">hotel</span> Hotels
            </a>
          </div>
          <div class="dock-trip-capsule" id="tripTypeGroup">
            <button type="button" id="btnOneWay" class="dock-trip-btn active" data-trip="one-way">One way</button>
            <button type="button" id="btnRoundTrip" class="dock-trip-btn" data-trip="round-trip">Round trip</button>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
