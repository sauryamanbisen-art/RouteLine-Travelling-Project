<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Results | RouteLine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="./src/css/global/style.css">
    <link rel="stylesheet" href="./src/css/train/train.css">
    <link rel="stylesheet" href="./src/css/train/pnr-status.css">
    <link rel="stylesheet" href="./src/css/auth/auth-modal.css">
    <link rel="stylesheet" href="./src/css/home/homepage.css">
</head>

<body>
    <header class="header" style="background: var(--dark-blue);">
        <div class="header-container">
            <div class="logo">
                <img src="./public/logo.svg" alt="RouteLine Logo">
                <a href="index.html" style="color:white; text-decoration:none;">RouteLine</a>
            </div>
            <nav class="nav-links">
                <a href="index.html" class="active">Trains</a>
                <a href="flight-results.html">Flights</a>
                <a href="bus-results.html">Buses</a>
                <a href="hotel-results.html">Hotels</a>
                <a href="#">Offers</a>
            </nav>
            <div class="header-actions">
                <a href="#" class="help-link"><i data-lucide="help-circle" class="icon-small"></i> Help</a>
                <div class="divider"></div>
                <a href="#" class="login-link"><i data-lucide="user" class="icon-small"></i> Login / Sign up</a>
            </div>
        </div>
    </header>

    <div class="results-container">
        <!-- Top Compact Search Bar for Quick Searches & Modifying -->
        <div class="train-top-search-widget">
            <form id="train-search-form">
                <div class="train-search-form-row">
                    <div class="train-input-group">
                        <i data-lucide="map-pin"></i>
                        <div class="train-input-text">
                            <label>From</label>
                            <input type="text" id="train-from-input" name="origin" value="New Delhi (NDLS)"
                                list="train-stations-list" placeholder="Enter station or code (e.g. New Delhi)" required>
                        </div>
                    </div>

                    <button type="button" class="train-swap-btn" id="train-swap-btn" title="Swap Stations">
                        <i data-lucide="arrow-left-right"></i>
                    </button>

                    <div class="train-input-group">
                        <i data-lucide="map-pin"></i>
                        <div class="train-input-text">
                            <label>To</label>
                            <input type="text" id="train-to-input" name="destination" value="Kanyakumari (CAPE)"
                                list="train-stations-list" placeholder="Enter station or code (e.g. Kanyakumari)" required>
                        </div>
                    </div>

                    <div class="train-input-group" style="max-width: 175px;">
                        <i data-lucide="calendar"></i>
                        <div class="train-input-text">
                            <label>Journey Date</label>
                            <input type="date" id="train-date-input" name="date">
                        </div>
                    </div>

                    <div class="train-input-group" style="max-width: 170px;">
                        <i data-lucide="layers"></i>
                        <div class="train-input-text">
                            <label>Class</label>
                            <select id="train-class-select" name="class">
                                <option value="All">All Classes</option>
                                <option value="Sleeper" selected>Sleeper (SL)</option>
                                <option value="3A">AC 3 Tier (3A)</option>
                                <option value="2A">AC 2 Tier (2A)</option>
                                <option value="1A">AC First Class (1A)</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="train-search-submit-btn" id="train-search-btn">
                        <i data-lucide="search"></i> Search
                    </button>
                </div>
            </form>
        </div>

        <datalist id="train-stations-list">
            <option value="New Delhi (NDLS)"></option>
            <option value="Kanyakumari (CAPE)"></option>
            <option value="Old Delhi (DLI)"></option>
            <option value="Hazrat Nizamuddin (NZM)"></option>
            <option value="Nagpur Jn (NGP)"></option>
            <option value="Pune Jn (PUNE)"></option>
            <option value="Mumbai Central (MMCT)"></option>
            <option value="Bandra Terminus (BDTS)"></option>
            <option value="Ujjain Jn (UJN)"></option>
            <option value="Indore Jn (INDB)"></option>
            <option value="Jawai Bandh (JWB)"></option>
            <option value="Mumbai CSMT (CSMT)"></option>
            <option value="Jaipur Jn (JP)"></option>
            <option value="Ahmedabad Jn (ADI)"></option>
            <option value="Howrah Jn (HWH)"></option>
            <option value="KSR Bengaluru (SBC)"></option>
            <option value="Chennai Central (MAS)"></option>
        </datalist>

        <!-- Toolbar Row -->
        <div class="train-toolbar-row">
            <div class="search-summary" style="margin-bottom: 0;">
                <h2 id="route-summary"><i data-lucide="train"></i> Searching Trains...</h2>
            </div>
            <div class="train-controls-bar">
                <div class="train-quick-search-box">
                    <input type="text" id="quick-train-number-input" placeholder="Search Train No. / Name (e.g. 12479)">
                    <button type="button" id="quick-train-search-btn" title="Search Train">
                        <i data-lucide="search"></i>
                    </button>
                </div>
                <div class="sort-select-wrapper">
                    <label for="sort-trains-select"><i data-lucide="arrow-down-up" style="width:14px;height:14px;"></i>
                        Sort by:</label>
                    <select id="sort-trains-select">
                        <option value="departure">Departure (Earliest)</option>
                        <option value="duration">Fastest First</option>
                        <option value="price">Price (Lowest)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Dynamic Results Container -->
        <div id="train-results-container">
            <!-- Loading Spinner / Cards rendered dynamically by train.js -->
        </div>
    </div>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="footer-inner"><a href="index.html" class="footer-logo"><img src="./public/logo.svg"
                    alt="RouteLine">RouteLine</a>
            <div class="footer-links"><a href="#">About</a><a href="#">Blog</a><a href="#">Careers</a><a
                    href="#">Contact</a><a href="#">Terms</a><a href="#">Privacy</a></div>
            <p class="footer-copy">© 2026 RouteLine. All rights reserved.</p>
        </div>
    </footer>

    <script type="module" src="./src/js/train/train.js"></script>
    <script>
        lucide.createIcons();
    </script>

</body>

</html>
