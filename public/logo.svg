<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">RouteLine premium monogram</title>
  <desc id="desc">A refined ivory and champagne-gold RL monogram with a route line on a deep forest-green rounded square.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182C27"/>
      <stop offset="0.55" stop-color="#10211D"/>
      <stop offset="1" stop-color="#091713"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF0C7"/>
      <stop offset="0.42" stop-color="#D8B978"/>
      <stop offset="0.72" stop-color="#B9924F"/>
      <stop offset="1" stop-color="#F2DDA9"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFDF5"/>
      <stop offset="1" stop-color="#DAD7C9"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#C6A566"/>
      <stop offset="1" stop-color="#F4E2B5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity=".28"/>
    </filter>
  </defs>

  <!-- Deep evergreen enamel tile -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#tile)"/>
  <rect x="21.5" y="21.5" width="469" height="469" rx="110.5" fill="none" stroke="#C6A566" stroke-opacity=".55" stroke-width="3"/>
  <path d="M132 30H380C435 30 482 77 482 132V170C391 100 278 63 132 30Z" fill="#FFFFFF" opacity=".035"/>

  <!-- Route line sits behind the monogram -->
  <path d="M112 389L394 111" fill="none" stroke="#07130F" stroke-width="13" stroke-linecap="round" opacity=".7"/>
  <path d="M112 389L394 111" fill="none" stroke="url(#route)" stroke-width="6" stroke-linecap="round"/>

  <!-- Custom geometric monogram -->
  <g filter="url(#shadow)">
    <path d="M104 346L132 151H218C264 151 289 175 289 213C289 247 269 270 236 279L282 346H232L193 284H167L158 346H104ZM174 239H211C231 239 242 230 242 214C242 201 233 194 215 194H180L174 239Z" fill="url(#ivory)"/>
    <path d="M274 346L302 151H348L326 307H407L401 346H274Z" fill="url(#gold)"/>
  </g>

  <!-- Origin node -->
  <circle cx="112" cy="389" r="18" fill="#10211D" stroke="url(#gold)" stroke-width="5"/>
  <circle cx="112" cy="389" r="6" fill="#F3E1B4"/>

  <!-- Destination marker -->
  <circle cx="394" cy="111" r="25" fill="#10211D" stroke="url(#gold)" stroke-width="7"/>
  <circle cx="394" cy="111" r="8" fill="#F3E1B4"/>

  <!-- Small understated inner highlight -->
  <path d="M70 112C70 89 89 70 112 70" fill="none" stroke="#FFFFFF" stroke-opacity=".12" stroke-width="2" stroke-linecap="round"/>
</svg>
